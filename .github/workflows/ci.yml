name: ElectroCotiza CI / CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Test & Build Production
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧪 Ejecutar Suite de Pruebas de Negocio (23 tests)
        run: node tests/verification.mjs

      - name: 📄 Auditar Confidencialidad de PDF (Cero fugas de proveedores)
        run: node tests/test-pdf-export.mjs

      - name: 🚀 Compilar Proyecto Next.js en Producción
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
